name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: qubitflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      QF_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke test
        run: python smoke.py
      - name: Run controlled experiment sweep
        run: python run.py
      - name: Analyze policy results
        run: python analyze_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: qubitflow-results
          path: |
            results.csv
            workload_summary.csv
            policy_summary.csv
            workload_geomeans.csv
            workload_class_summary.csv
            summary.md
            experiment_manifest.json
            traces/
          if-no-files-found: error
